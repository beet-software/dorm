site_name: dORM
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - dart
    - yaml
    - json
    - shell
  navigation_depth: 4
  sticky_navigation: true
  collapse_navigation: true
  titles_only: true
nav:
  - Home: index.md
  - When to use dORM?: when-to-use/index.md
  - Quickstart:
      - Generate a showcase project: quickstart/generate-a-showcase.md
      - Build a small store: quickstart/index.md
      - Create the Dart project: quickstart/installation.md
      - Define users, profiles, and products: quickstart/declaring-models.md
      - Generate the store API: quickstart/generating-models.md
      - Connect the in-memory engine: quickstart/creating-the-engine.md
      - Create and read a user: quickstart/create-and-read-data.md
      - Add carts and cart items: quickstart/relations-and-cart.md
      - Add reviews with multiple content types: quickstart/reviews-and-polymorphism.md
      - Handle input and live reads: quickstart/forms-and-live-reads.md
  - Operations:
      - Apply an operation: operations/index.md
      - Creating: operations/creating.md
      - Reading: operations/reading.md
      - Updating: operations/updating.md
      - Deleting: operations/deleting.md
      - Using filters: operations/using-filters.md
      - Using sorting: operations/using-sorting.md
      - Using pagination: operations/using-pagination.md
      - Using transactions: operations/using-transactions.md
      - Using synchronization: operations/using-synchronization.md
      - Using migrations: operations/using-migrations.md
      - Handling errors: operations/handling-errors.md
  - Engines:
      - Choose an engine: engines/index.md
      - Run in-memory: engines/memory.md
      - Run with BLoC: engines/bloc.md
      - Run with Firebase: engines/firebase.md
      - Run with Cloud Firestore: engines/firestore.md
      - Run with MySQL: engines/mysql.md
      - Run with PostgreSQL: engines/postgres.md
      - Run with MongoDB: engines/mongo.md
      - Run with HTTP/JSON: engines/http.md
      - Run with SQLite: engines/sqlite.md
  - Annotations:
      - Learn the annotations: annotations/index.md
      - Data: annotations/data.md
      - Model: annotations/model.md
      - Field: annotations/field.md
      - ModelField: annotations/model-field.md
      - ForeignField: annotations/foreign-field.md
      - DerivedField: annotations/derived-field.md
      - PolymorphicData: annotations/polymorphic-data.md
      - PolymorphicField: annotations/polymorphic-field.md
  - Model anatomy:
      - Start with the generated pieces: model-anatomy/index.md
      - Data: model-anatomy/data.md
      - Model: model-anatomy/model.md
      - Dependency: model-anatomy/dependency.md
      - Fields: model-anatomy/fields.md
      - EntitySchema: model-anatomy/entity-schema.md
      - Entity: model-anatomy/entity.md
      - Repository: model-anatomy/repository.md
      - Dorm: model-anatomy/dorm.md
      - Relationship paths: model-anatomy/relations.md
  - User guide:
      - Best practices: user-guide/best-practices.md
      - Recipes: user-guide/recipes/index.md
      - Migration to v2: user-guide/migration-to-v2.md
  - Developer guide:
      - Work on dORM locally: developer-guide/index.md
      - Implement a custom engine: developer-guide/custom-engine.md
      - Test an engine: developer-guide/test-an-engine.md
  - Troubleshooting:
      - Start troubleshooting: troubleshooting/index.md
      - Find the failing layer: troubleshooting/error-by-layer.md
      - Fix code generation problems: troubleshooting/code-generation-problems.md
      - Check surprising behaviors: troubleshooting/surprising-behaviors.md
  - Reference:
      - Reference overview: reference/index.md
      - Architecture and boundaries: reference/architecture.md
      - Public surface: reference/public-surface.md
      - Generated output contract: reference/generated-contract.md
      - Framework contracts: reference/framework-contracts.md
      - Migration protocol: reference/migrations.md
      - Engine and platform support: reference/engine-support.md
      - Portable errors: reference/errors.md
      - Synchronization protocol: reference/synchronization.md
      - Execution and performance model: reference/performance.md
      - Glossary: reference/glossary.md
      - Release status: reference/release-status.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/codeblocks.css
