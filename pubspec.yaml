name: dorm_workspace
description: Workspace for the dORM Dart and Flutter packages.
publish_to: none
repository: https://github.com/beet-software/dorm.git

environment:
  sdk: ">=3.9.0 <4.0.0"

workspace:
  - dorm_annotations
  - dorm_generator
  - dorm_framework
  - dorm_bloc_database
  - dorm_firebase_database
  - dorm_mysql_database
  - dorm_postgres_database
  - dorm_mongo_database
  - dorm_memory_database
  - dorm_http_database
  - dorm_firestore_database
  - dorm_sqlite_database
  - dorm_test
  - dorm_example

dev_dependencies:
  melos: ^8.6.0

melos:
  command:
    version:
      mode: fixed
      workspaceTag: true
      workspaceChangelog: true
      includeScopes: true
      linkToCommits: true
  scripts:
    format:
      description: Format all workspace packages.
      exec: dart format .
    analyze:
      description: Analyze all workspace packages.
      exec: dart analyze .
    test:
      description: Run tests in workspace packages that contain a test directory.
      exec: dart test
      packageFilters:
        dirExists: test
        ignore:
          - dorm_firebase_database
          - dorm_firestore_database
    test:flutter:
      description: Run Flutter-based workspace tests.
      exec: flutter test
      packageFilters:
        scope:
          - dorm_firebase_database
          - dorm_firestore_database
    generate:
      description: Run build_runner in workspace packages that depend on it.
      run: melos exec -c 1 --depends-on build_runner -- "dart run build_runner build"
