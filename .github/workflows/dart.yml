name: Dart

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: dorm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [dorm_framework, dorm_annotations]
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
      
      - name: Install workspace dependencies
        run: dart pub get

      - name: Build models
        if: ${{ matrix.pkg == 'dorm_framework' }}
        working-directory: ./${{ matrix.pkg }}
        run: dart run build_runner build test

      - name: Analyze project source
        working-directory: ./${{ matrix.pkg }}
        run: dart analyze

  release:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    needs:
      - build
      - verify-mongo
      - verify-engine-compliance
      - verify-example-generator
      - verify-http
      - verify-firebase-compliance
      - verify-firestore-compliance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Prepare main branch
        run: |
          git switch --force-create main "${GITHUB_SHA}"
          git fetch origin main
          git branch --set-upstream-to=origin/main main

      - name: Validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION || {
            echo 'VERSION is missing.'
            exit 1
          }
          line_count="$(awk 'END { print NR }' VERSION)"
          version="$(sed 's/\r$//' VERSION)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "$line_count" -ne 1 ] || [[ ! "$version" =~ $semver ]]; then
            echo 'VERSION must contain exactly one valid SemVer line.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: dart pub get

      - name: Version and push workspace
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          current_version=''
          for pubspec in dorm_*/pubspec.yaml; do
            actual="$(sed -n 's/^version:[[:space:]]*//p' "$pubspec" | head -n 1)"
            test -n "$actual" || {
              echo "Missing version in $pubspec."
              exit 1
            }
            if [ -z "$current_version" ]; then
              current_version="$actual"
            elif [ "$actual" != "$current_version" ]; then
              echo "Workspace version mismatch: $pubspec declares $actual, expected $current_version."
              exit 1
            fi
          done

          set +e
          git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" > /tmp/dorm-release-tag
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "The release tag $RELEASE_TAG already exists; validating it for a safe retry."
            git fetch --tags
            git checkout --detach "$RELEASE_TAG"
            dart run tool/sync_dorm_example_version.dart
            if ! git diff --quiet; then
              echo "Existing tag $RELEASE_TAG does not contain the expected generated release files."
              git diff -- dorm_example/lib/src/release.dart
              exit 1
            fi
            exit 0
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "Could not determine whether $RELEASE_TAG exists remotely."
            cat /tmp/dorm-release-tag
            exit 1
          fi
          if [ "$current_version" = "$RELEASE_VERSION" ]; then
            echo "VERSION $RELEASE_VERSION is already declared by the workspace."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          dart run melos version --all --manual-version="dorm_annotations:$RELEASE_VERSION" --yes
          dart run tool/sync_dorm_example_version.dart
          git diff --exit-code
          test "$(git tag --list "$RELEASE_TAG")" = "$RELEASE_TAG" || {
            echo "Melos did not create the expected tag $RELEASE_TAG."
            exit 1
          }
          if ! git push origin HEAD:main --follow-tags; then
            echo "Release commit/tag were created locally, but the push failed. Retry this workflow without creating a new tag."
            exit 1
          fi
  publish-children:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    needs:
      - release
      - publish-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        pkg: [dorm_generator, dorm_firebase_database, dorm_firestore_database, dorm_bloc_database, dorm_memory_database, dorm_mysql_database, dorm_postgres_database, dorm_mongo_database, dorm_http_database, dorm_sqlite_database, dorm_example]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        run: dart pub get

      - name: Prepare packages for publishing
        run: dart run tool/prepare_package.dart --package ${{ matrix.pkg }}

      - name: Verify release tag matches package version
        shell: bash
        run: |
          expected="${{ needs.release.outputs.version }}"
          actual="$(sed -n 's/^version:[[:space:]]*//p' "${{ matrix.pkg }}/pubspec.yaml" | head -n 1)"
          test "$actual" = "$expected" || {
            echo "${{ matrix.pkg }} declares $actual, but the release tag is $expected."
            exit 1
          }

      - name: Publish to pub.dev
        working-directory: ./${{ matrix.pkg }}
        shell: bash
        run: |
          if grep -Eq 'sdk:[[:space:]]*flutter' pubspec.yaml; then
            flutter pub publish --force
          else
            dart pub publish --force
          fi

  publish-core:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - release
      - build
      - verify-mongo
      - verify-engine-compliance
      - verify-example-generator
      - verify-http
      - verify-firebase-compliance
      - verify-firestore-compliance
    strategy:
      matrix:
        pkg: [dorm_framework, dorm_annotations]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        run: dart pub get

      - name: Verify release tag matches package version
        shell: bash
        run: |
          expected="${{ needs.release.outputs.version }}"
          actual="$(sed -n 's/^version:[[:space:]]*//p' "${{ matrix.pkg }}/pubspec.yaml" | head -n 1)"
          test "$actual" = "$expected" || {
            echo "${{ matrix.pkg }} declares $actual, but the release tag is $expected."
            exit 1
          }

      - name: Prepare package for publishing
        run: dart run tool/prepare_package.dart --package ${{ matrix.pkg }}

      - name: Publish to pub.dev
        working-directory: ./${{ matrix.pkg }}
        shell: bash
        run: |
          if grep -Eq 'sdk:[[:space:]]*flutter' pubspec.yaml; then
            flutter pub publish --force
          else
            dart pub publish --force
          fi

  verify-mongo:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze MongoDB package
        working-directory: ./dorm_mongo_database
        run: dart analyze

      - name: Test MongoDB package
        working-directory: ./dorm_mongo_database
        run: dart test

      - name: Install example dependencies
        working-directory: ./dorm_mongo_database/example
        run: dart pub get

      - name: Generate example models
        working-directory: ./dorm_mongo_database/example
        run: dart run build_runner build

      - name: Analyze MongoDB example
        working-directory: ./dorm_mongo_database/example
        run: dart analyze

  verify-engine-compliance:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [dorm_bloc_database, dorm_memory_database, dorm_mysql_database, dorm_postgres_database, dorm_mongo_database, dorm_http_database, dorm_sqlite_database]
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze compliance package
        working-directory: ./${{ matrix.pkg }}
        run: dart analyze

      - name: Run engine compliance suite
        working-directory: ./${{ matrix.pkg }}
        run: dart test test/compliance_test.dart

  verify-example-generator:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze example generator
        working-directory: ./dorm_example
        run: dart analyze

      - name: Test example generator
        working-directory: ./dorm_example
        run: dart test

  verify-http:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze HTTP package
        working-directory: ./dorm_http_database
        run: dart analyze

      - name: Test HTTP package
        working-directory: ./dorm_http_database
        run: dart test

      - name: Install example dependencies
        working-directory: ./dorm_http_database/example
        run: dart pub get

      - name: Generate HTTP example models
        working-directory: ./dorm_http_database/example
        run: dart run build_runner build

      - name: Analyze HTTP example
        working-directory: ./dorm_http_database/example
        run: dart analyze

  verify-firebase-compliance:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze Firebase package
        working-directory: ./dorm_firebase_database
        run: flutter analyze --no-fatal-infos

      - name: Run Firebase compliance suite
        working-directory: ./dorm_firebase_database
        run: flutter test test/compliance_test.dart

  verify-firestore-compliance:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze Firestore package
        working-directory: ./dorm_firestore_database
        run: flutter analyze --no-fatal-infos

      - name: Run Firestore compliance suite
        working-directory: ./dorm_firestore_database
        run: flutter test test/compliance_test.dart
