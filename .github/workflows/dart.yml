name: Dart

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [dorm_framework, dorm_annotations]
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
      
      - name: Install workspace dependencies
        run: dart pub get

      - name: Build models
        if: ${{ matrix.pkg == 'dorm_framework' }}
        working-directory: ./${{ matrix.pkg }}
        run: dart run build_runner build test

      - name: Analyze project source
        working-directory: ./${{ matrix.pkg }}
        run: dart analyze

  publish-children:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - publish-core
    strategy:
      matrix:
        pkg: [dorm_generator, dorm_firebase_database, dorm_firestore_database, dorm_bloc_database, dorm_memory_database, dorm_mysql_database, dorm_postgres_database, dorm_mongo_database, dorm_http_database, dorm_sqlite_database, dorm_example]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        run: dart pub get

      - name: Prepare packages for publishing
        run: dart run tool/prepare_package.dart --package ${{ matrix.pkg }}

      - name: Verify release tag matches package version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version:[[:space:]]*//p' "${{ matrix.pkg }}/pubspec.yaml" | head -n 1)"
          test "$actual" = "$expected" || {
            echo "${{ matrix.pkg }} declares $actual, but the release tag is $expected."
            exit 1
          }

      - name: Publish to pub.dev
        working-directory: ./${{ matrix.pkg }}
        shell: bash
        run: |
          if grep -Eq 'sdk:[[:space:]]*flutter' pubspec.yaml; then
            flutter pub publish --force
          else
            dart pub publish --force
          fi

  publish-core:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - build
      - verify-mongo
      - verify-engine-compliance
      - verify-example-generator
      - verify-http
      - verify-firebase-compliance
      - verify-firestore-compliance
    strategy:
      matrix:
        pkg: [dorm_framework, dorm_annotations]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        run: dart pub get

      - name: Verify release tag matches package version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version:[[:space:]]*//p' "${{ matrix.pkg }}/pubspec.yaml" | head -n 1)"
          test "$actual" = "$expected" || {
            echo "${{ matrix.pkg }} declares $actual, but the release tag is $expected."
            exit 1
          }

      - name: Prepare package for publishing
        run: dart run tool/prepare_package.dart --package ${{ matrix.pkg }}

      - name: Publish to pub.dev
        working-directory: ./${{ matrix.pkg }}
        shell: bash
        run: |
          if grep -Eq 'sdk:[[:space:]]*flutter' pubspec.yaml; then
            flutter pub publish --force
          else
            dart pub publish --force
          fi

  verify-mongo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze MongoDB package
        working-directory: ./dorm_mongo_database
        run: dart analyze

      - name: Test MongoDB package
        working-directory: ./dorm_mongo_database
        run: dart test

      - name: Install example dependencies
        working-directory: ./dorm_mongo_database/example
        run: dart pub get

      - name: Generate example models
        working-directory: ./dorm_mongo_database/example
        run: dart run build_runner build

      - name: Analyze MongoDB example
        working-directory: ./dorm_mongo_database/example
        run: dart analyze

  verify-engine-compliance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [dorm_bloc_database, dorm_memory_database, dorm_mysql_database, dorm_postgres_database, dorm_mongo_database, dorm_http_database, dorm_sqlite_database]
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze compliance package
        working-directory: ./${{ matrix.pkg }}
        run: dart analyze

      - name: Run engine compliance suite
        working-directory: ./${{ matrix.pkg }}
        run: dart test test/compliance_test.dart

  verify-example-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze example generator
        working-directory: ./dorm_example
        run: dart analyze

      - name: Test example generator
        working-directory: ./dorm_example
        run: dart test

  verify-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze HTTP package
        working-directory: ./dorm_http_database
        run: dart analyze

      - name: Test HTTP package
        working-directory: ./dorm_http_database
        run: dart test

      - name: Install example dependencies
        working-directory: ./dorm_http_database/example
        run: dart pub get

      - name: Generate HTTP example models
        working-directory: ./dorm_http_database/example
        run: dart run build_runner build

      - name: Analyze HTTP example
        working-directory: ./dorm_http_database/example
        run: dart analyze

  verify-firebase-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze Firebase package
        working-directory: ./dorm_firebase_database
        run: flutter analyze --no-fatal-infos

      - name: Run Firebase compliance suite
        working-directory: ./dorm_firebase_database
        run: flutter test test/compliance_test.dart

  verify-firestore-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze Firestore package
        working-directory: ./dorm_firestore_database
        run: flutter analyze --no-fatal-infos

      - name: Run Firestore compliance suite
        working-directory: ./dorm_firestore_database
        run: flutter test test/compliance_test.dart
