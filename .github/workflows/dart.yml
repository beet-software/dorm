name: Dart

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - VERSION

concurrency:
  group: dorm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [dorm_framework, dorm_annotations]
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
      
      - name: Install workspace dependencies
        run: dart pub get

      - name: Build models
        if: ${{ matrix.pkg == 'dorm_framework' }}
        working-directory: ./${{ matrix.pkg }}
        run: dart run build_runner build test

      - name: Analyze project source
        working-directory: ./${{ matrix.pkg }}
        run: dart analyze

  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - build
      - verify-mongo
      - verify-engine-compliance
      - verify-example-generator
      - verify-sync
      - verify-migrations
      - verify-http
      - verify-firebase-compliance
      - verify-firestore-compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Prepare main branch
        run: |
          git switch --force-create main "${GITHUB_SHA}"
          git fetch origin main
          git branch --set-upstream-to=origin/main main

      - name: Validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION || {
            echo 'VERSION is missing.'
            exit 1
          }
          line_count="$(awk 'END { print NR }' VERSION)"
          version="$(sed 's/\r$//' VERSION)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "$line_count" -ne 1 ] || [[ ! "$version" =~ $semver ]]; then
            echo 'VERSION must contain exactly one valid SemVer line.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: |
          dart pub get
          git restore --source=HEAD --worktree -- pubspec.lock

      - name: Version and push workspace
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          current_version=''
          for pubspec in dorm_*/pubspec.yaml; do
            actual="$(sed -n 's/^version:[[:space:]]*//p' "$pubspec" | head -n 1)"
            test -n "$actual" || {
              echo "Missing version in $pubspec."
              exit 1
            }
            if [ -z "$current_version" ]; then
              current_version="$actual"
            elif [ "$actual" != "$current_version" ]; then
              echo "Workspace version mismatch: $pubspec declares $actual, expected $current_version."
              exit 1
            fi
          done

          set +e
          git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" > /tmp/dorm-release-tag
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "The release tag $RELEASE_TAG already exists; validating it for a safe retry."
            git fetch --tags
            git checkout --detach "$RELEASE_TAG"
            dart run tool/sync_dorm_example_version.dart
            git restore --source=HEAD --worktree -- pubspec.lock
            if ! git diff --quiet; then
              echo "Existing tag $RELEASE_TAG does not contain the expected generated release files."
              git diff -- dorm_example/lib/src/release.dart
              exit 1
            fi
            echo "The release tag already exists. Trusted publishing is triggered only by the original tag push event."
            echo "This retry cannot publish the existing version without replacing the tag. Use the one-time recovery procedure or release a new version."
            exit 1
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "Could not determine whether $RELEASE_TAG exists remotely."
            cat /tmp/dorm-release-tag
            exit 1
          fi
          if [ "$current_version" = "$RELEASE_VERSION" ]; then
            echo "VERSION $RELEASE_VERSION is already declared by the workspace."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          dart run melos version --all --manual-version="dorm_annotations:$RELEASE_VERSION" --yes
          dart run tool/sync_dorm_example_version.dart
          git restore --source=HEAD --worktree -- pubspec.lock
          git diff --exit-code
          test "$(git tag --list "$RELEASE_TAG")" = "$RELEASE_TAG" || {
            echo "Melos did not create the expected tag $RELEASE_TAG."
            exit 1
          }


      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          if ! git push origin HEAD:main --follow-tags; then
            echo "Release commit/tag were created locally, but the push failed. Retry this workflow without creating a new tag."
            exit 1
          fi

  verify-mongo:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze MongoDB package
        working-directory: ./dorm_mongo_database
        run: dart analyze

      - name: Test MongoDB package
        working-directory: ./dorm_mongo_database
        run: dart test

      - name: Install example dependencies
        working-directory: ./dorm_mongo_database/example
        run: dart pub get

      - name: Generate example models
        working-directory: ./dorm_mongo_database/example
        run: dart run build_runner build

      - name: Analyze MongoDB example
        working-directory: ./dorm_mongo_database/example
        run: dart analyze

  verify-engine-compliance:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [dorm_bloc_database, dorm_memory_database, dorm_mysql_database, dorm_postgres_database, dorm_mongo_database, dorm_http_database, dorm_sqlite_database]
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze compliance package
        working-directory: ./${{ matrix.pkg }}
        run: dart analyze

      - name: Run engine compliance suite
        working-directory: ./${{ matrix.pkg }}
        run: dart test test/compliance_test.dart

  verify-example-generator:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze example generator
        working-directory: ./dorm_example
        run: dart analyze

      - name: Test example generator
        working-directory: ./dorm_example
        run: dart test


  verify-sync:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze synchronization package
        working-directory: ./dorm_sync
        run: dart analyze

      - name: Test synchronization package
        working-directory: ./dorm_sync
        run: dart test

      - name: Analyze synchronization example
        working-directory: ./dorm_sync
        run: dart analyze example

      - name: Validate publication archive
        working-directory: ./dorm_sync
        run: dart pub publish --dry-run
  verify-migrations:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - name: Install workspace dependencies
        run: dart pub get
      - name: Analyze migration CLI
        working-directory: ./dorm_generator
        run: dart analyze
      - name: Test migration schema contracts
        working-directory: ./dorm_generator
        run: dart test test/migration_schema_test.dart
      - name: Analyze migrations package
        working-directory: ./dorm_migrations
        run: dart analyze
      - name: Test migrations package
        working-directory: ./dorm_migrations
        run: dart test
      - name: Analyze migrations example
        working-directory: ./dorm_migrations
        run: dart analyze example

  verify-http:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze HTTP package
        working-directory: ./dorm_http_database
        run: dart analyze

      - name: Test HTTP package
        working-directory: ./dorm_http_database
        run: dart test

      - name: Install example dependencies
        working-directory: ./dorm_http_database/example
        run: dart pub get

      - name: Generate HTTP example models
        working-directory: ./dorm_http_database/example
        run: dart run build_runner build

      - name: Analyze HTTP example
        working-directory: ./dorm_http_database/example
        run: dart analyze

  verify-firebase-compliance:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze Firebase package
        working-directory: ./dorm_firebase_database
        run: flutter analyze --no-fatal-infos

      - name: Run Firebase compliance suite
        working-directory: ./dorm_firebase_database
        run: flutter test test/compliance_test.dart

  verify-firestore-compliance:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze Firestore package
        working-directory: ./dorm_firestore_database
        run: flutter analyze --no-fatal-infos

      - name: Run Firestore compliance suite
        working-directory: ./dorm_firestore_database
        run: flutter test test/compliance_test.dart
  publish-core:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        pkg: [dorm_framework, dorm_annotations]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        run: dart pub get

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(sed -n 's/^version:[[:space:]]*//p' "${{ matrix.pkg }}/pubspec.yaml" | head -n 1)"
          test "$actual" = "$expected" || {
            echo "${{ matrix.pkg }} declares $actual, but the tag is $RELEASE_TAG."
            exit 1
          }

      - name: Check whether version is already published
        id: published
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="${{ matrix.pkg }}"
          version="${RELEASE_TAG#v}"
          if curl --fail --silent --show-error "https://pub.dev/api/packages/$package" |
            jq --exit-status --arg version "$version" 'any(.versions[]?; .version == $version)' >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package $version is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare package for publishing
        if: steps.published.outputs.published != 'true'
        run: dart run tool/prepare_package.dart --package ${{ matrix.pkg }}

      - name: Publish to pub.dev
        if: steps.published.outputs.published != 'true'
        working-directory: ./${{ matrix.pkg }}
        shell: bash
        run: |
          if grep -Eq 'sdk:[[:space:]]*flutter' pubspec.yaml; then
            flutter pub publish --force
          else
            dart pub publish --force
          fi

  publish-children:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs: publish-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        pkg: [dorm_generator, dorm_firebase_database, dorm_firestore_database, dorm_bloc_database, dorm_memory_database, dorm_mysql_database, dorm_postgres_database, dorm_mongo_database, dorm_http_database, dorm_sqlite_database, dorm_sync, dorm_migrations, dorm_example]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
      - uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        run: dart pub get

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(sed -n 's/^version:[[:space:]]*//p' "${{ matrix.pkg }}/pubspec.yaml" | head -n 1)"
          test "$actual" = "$expected" || {
            echo "${{ matrix.pkg }} declares $actual, but the tag is $RELEASE_TAG."
            exit 1
          }

      - name: Check whether version is already published
        id: published
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="${{ matrix.pkg }}"
          version="${RELEASE_TAG#v}"
          if curl --fail --silent --show-error "https://pub.dev/api/packages/$package" |
            jq --exit-status --arg version "$version" 'any(.versions[]?; .version == $version)' >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package $version is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare package for publishing
        if: steps.published.outputs.published != 'true'
        run: dart run tool/prepare_package.dart --package ${{ matrix.pkg }}

      - name: Publish to pub.dev
        if: steps.published.outputs.published != 'true'
        working-directory: ./${{ matrix.pkg }}
        shell: bash
        run: |
          if grep -Eq 'sdk:[[:space:]]*flutter' pubspec.yaml; then
            flutter pub publish --force
          else
            dart pub publish --force
          fi
