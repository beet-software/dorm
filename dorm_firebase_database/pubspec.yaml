name: dorm_firebase_database
version: 2.0.0-dev.2
resolution: workspace
description: A firebase_database database engine for dORM.
homepage: https://github.com/ezgrs/dorm/tree/main/dorm_firebase_database
repository: https://github.com/ezgrs/dorm.git
environment:
  sdk: '>=3.11.5 <4.0.0'
false_secrets:
  - example/lib/main.dart

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_database: ^12.5.0
  dorm_framework: ^2.0.0-dev.2
  rxdart: ^0.28.0
dev_dependencies:
  dorm_test: ^2.0.0-dev.2
  lints: ^5.0.0
  test: ^1.32.0

dependency_overrides:
  meta: 1.18.3
