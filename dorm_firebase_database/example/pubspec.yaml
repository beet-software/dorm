name: example
description: An application to demonstrate how to use dORM with Firebase Realtime Database.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  json_annotation: ^4.12.0
  dorm_framework:
    git:
      url: https://github.com/beet-software/dorm.git
      path: dorm_framework
      ref: main
  dorm_annotations:
    git:
      url: https://github.com/beet-software/dorm.git
      path: dorm_annotations
      ref: main
  dorm_firebase_database:
    git:
      url: https://github.com/beet-software/dorm.git
      path: dorm_firebase_database
      ref: main

  # The dependencies below are not required for dORM to work
  get_it: ^9.2.1
  provider: ^6.1.5+1
  device_preview: 1.3.1

dev_dependencies:
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  dorm_generator:
    git:
      url: https://github.com/beet-software/dorm.git
      path: dorm_generator
      ref: main

  # The dependencies below are not required for dORM to work
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# This section should be removed in production
dependency_overrides:
  meta: 1.18.3
  dorm_framework:
    path: ../../dorm_framework
  dorm_generator:
    path: ../../dorm_generator
  dorm_annotations:
    path: ../../dorm_annotations
  dorm_firebase_database:
    path: ..
